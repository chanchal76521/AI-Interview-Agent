<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div class="logo">🤖</div>
            <div>
                <h1>AI Interview Agent</h1>
                <p>Practice interviews with an AI interviewer</p>
            </div>
        </header>

        <section class="setup-card" id="setupCard">

            <h2>Start Your Interview</h2>

            <label>Choose Technology</label>

            <select id="topic">
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="JavaScript">JavaScript</option>
                <option value="React">React</option>
                <option value="Frontend Development">Frontend Development</option>
            </select>

            <label>Difficulty</label>

            <select id="difficulty">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>

            <button id="startBtn">Start Interview 🚀</button>

            <p id="setupError" class="error"></p>

        </section>


        <section class="interview-card hidden" id="interviewCard">

            <div class="top-bar">
                <span id="questionNumber">Question 1</span>
                <span id="score">Score: 0</span>
            </div>

            <div class="question-box">

                <span class="badge">AI Interviewer</span>

                <h2 id="question">
                    Loading question...
                </h2>

            </div>

            <label for="answer">Your Answer</label>

            <textarea
                id="answer"
                placeholder="Type your answer here..."
            ></textarea>

            <button id="submitBtn">
                Submit Answer
            </button>

            <div id="feedback" class="feedback hidden">

                <h3 id="feedbackTitle"></h3>

                <p id="feedbackText"></p>

                <div class="score-result">
                    <span>Question Score</span>
                    <strong id="questionScore">0/10</strong>
                </div>

                <div class="correct-answer">
                    <h4>💡 AI Explanation</h4>
                    <p id="explanation"></p>
                </div>

                <button id="nextBtn">
                    Next Question →
                </button>

            </div>

        </section>


        <section class="result-card hidden" id="resultCard">

            <div class="result-icon">🏆</div>

            <h2>Interview Completed!</h2>

            <p>Your final score</p>

            <div class="final-score">
                <span id="finalScore">0</span>/50
            </div>

            <p id="finalMessage"></p>

            <button id="restartBtn">
                Start New Interview
            </button>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
